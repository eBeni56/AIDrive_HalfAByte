# driver_monitor settings - loaded automatically at start (another file can be given with --config).
# Only the keys written here override the defaults; `uv run python -m driver_monitor --dump-config`
# prints every setting.

websocket:
  enabled: true
  # Every driver_state JSON message is sent here (one WebSocket text message per processed frame)
  # while the camera runs. Change it to the address of the receiving server (e.g. the simulator).
  url: "ws://localhost:8765"
  max_rate_hz: 0        # 0 = every frame (~30/s); e.g. 10 = at most 10 messages per second
  reconnect_s: 2.0      # the server may start later or restart: the monitor keeps reconnecting

camera_stream:
  # The camera preview (with the overlay) for the dashboard: http://localhost:8090/stream.mjpg
  enabled: true
  host: "localhost"
  port: 8090
  fps: 15
