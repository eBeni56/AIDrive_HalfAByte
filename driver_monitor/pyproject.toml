[project]
name = "driver-monitor"
version = "0.1.0"
description = "Camera-based driver monitoring: eyes closed, where the driver looks, phone in the hand (MediaPipe)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mediapipe==0.10.33",   # Tasks API; brings opencv-contrib-python (do not add opencv-python)
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "websockets>=13",
]

[project.scripts]
driver-monitor = "driver_monitor.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driver_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "UP046"]  # long lines: formatter handles code

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]
