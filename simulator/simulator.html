<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driving Scene Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b3a1f;
    font-family: system-ui, "Segoe UI", Arial, sans-serif; color: #fff;
    user-select: none; -webkit-user-select: none; }

  #scene { position: fixed; inset: 0; overflow: hidden; background: #25552b; touch-action: none; }
  .tuft { position: absolute; width: 14px; height: 10px; border-radius: 50% 50% 0 0;
    background: #2f6b36; opacity: .8; }

  /* Road: width/left are set from JS (3 lanes). Lane lines are drawn with gradients. */
  #road { position: absolute; top: 0; bottom: 0; background: #2a2d33;
    border-left: 5px solid #fff; border-right: 5px solid #fff; }
  .dash { position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px;
    background: repeating-linear-gradient(to bottom, #fff 0 40px, transparent 40px 80px); }

  .obj { position: absolute; transform: translate(-50%, -50%); touch-action: none; cursor: grab; }
  .obj svg { display: block; width: 100%; height: 100%; }
  .obj.dragging { cursor: grabbing; z-index: 50; }
  .ghost { position: fixed; pointer-events: none; z-index: 100; opacity: .75;
    transform: translate(-50%, -50%); }
  .ghost.bad { opacity: .35; filter: grayscale(1) drop-shadow(0 0 6px #f44); }
  #ego { z-index: 5; cursor: default; }
  #ego-ring { position: absolute; border: 3px solid #ffd54a; border-radius: 14px;
    box-shadow: 0 0 18px 4px rgba(255,213,74,.55); transform: translate(-50%, -50%); }

  #toolbar { position: fixed; left: 0; right: 0; bottom: 0; height: 140px; z-index: 60;
    display: flex; align-items: center; justify-content: center; gap: 22px;
    background: #12141a; border-top: 3px solid #444; padding: 0 16px; }
  .tool { width: 120px; height: 116px; border-radius: 12px; background: #232733;
    border: 2px solid #5b6275; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px; cursor: grab; touch-action: none; }
  .tool:hover { border-color: #fff; }
  .tool svg { height: 64px; width: auto; max-width: 90px; pointer-events: none; }
  .tool span { font-size: 18px; font-weight: 700; pointer-events: none; }
  #clear { height: 116px; width: 110px; border-radius: 12px; border: 2px solid #b33;
    background: #3a1a1a; color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; }
  #clear:hover { background: #5a2020; }

  #status { position: fixed; top: 12px; right: 12px; width: 440px; max-width: 45vw; z-index: 70;
    background: rgba(12,14,18,.9); border: 2px solid #444; border-radius: 10px; padding: 10px 12px; }
  #conn { font-size: 20px; font-weight: 800; }
  #conn.up { color: #4cff7a; }
  #conn.down { color: #ff5a5a; }
  #log { margin-top: 8px; font: 12px/1.35 Consolas, "Courier New", monospace; max-height: 260px;
    overflow: hidden; }
  #log div { padding: 2px 0; border-top: 1px solid #333; word-break: break-all; }
  #log .unsent { color: #ffb347; }
  #hint { position: fixed; top: 12px; left: 12px; z-index: 70; font-size: 15px; color: #cfd6e4;
    background: rgba(12,14,18,.75); padding: 8px 12px; border-radius: 8px; }

  /* ---------- drive phase ---------- */
  #start { height: 116px; width: 190px; border-radius: 12px; border: 3px solid #4cff7a; background: #17652c;
    color: #fff; font-size: 22px; font-weight: 800; line-height: 1.15; cursor: pointer; }
  #start:hover:not(:disabled) { background: #1f8a3c; }
  #start:disabled { border-color: #555; background: #2a2d33; color: #777; cursor: not-allowed; }

  #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: none; background: #000; }
  body.sim #view { display: block; }
  body.sim #scene, body.sim #toolbar, body.sim #hint { display: none; }

  /* During the simulation the status panel shrinks into the bottom-right corner (over the dashboard). */
  body.sim #status { top: auto; bottom: 10px; right: 10px; width: 340px; max-height: 20vh; overflow: hidden;
    padding: 6px 9px; background: rgba(12,14,18,.82); }
  body.sim #conn { font-size: 13px; }
  body.sim #log { margin-top: 4px; font-size: 10px; max-height: 46px; }
  #simstats { display: none; margin-top: 4px; font: 11px/1.3 Consolas, "Courier New", monospace;
    color: #cfd6e4; white-space: pre; }
  body.sim #simstats { display: block; }

  #countdown { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center;
    pointer-events: none; font-size: 30vh; font-weight: 900; color: #fff;
    text-shadow: 0 0 40px rgba(0,0,0,.9), 0 8px 0 #000; }
  #countdown.show { display: flex; }
  #countdown.go { color: #4cff7a; }

  #abort { position: fixed; left: 12px; bottom: 12px; z-index: 85; display: none; font-size: 16px; font-weight: 800;
    padding: 10px 16px; border-radius: 10px; border: 2px solid #ff5a5a; background: #3a1a1a; color: #fff; cursor: pointer; }
  #abort:hover { background: #5a2020; }
  body.sim #abort { display: block; }

  #done { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.45); }
  #done.show { display: flex; }
  #done .box { background: #12141a; border: 3px solid #4cff7a; border-radius: 16px; padding: 28px 44px; text-align: center; }
  #done .title { font-size: 44px; font-weight: 900; }
  #done-info { margin: 10px 0 22px; font-size: 18px; color: #cfd6e4; }
  #back { font-size: 22px; font-weight: 800; padding: 14px 28px; border-radius: 10px; border: 2px solid #fff;
    background: #17652c; color: #fff; cursor: pointer; }
  #back:hover { background: #1f8a3c; }
</style>
</head>
<body>

<div id="scene">
  <div id="road">
    <div class="dash" style="left:33.333%"></div>
    <div class="dash" style="left:66.666%"></div>
  </div>
  <div id="ego-ring"></div>
</div>

<div id="hint">Drag an icon onto the road. Drag placed objects to move. Right-click / double-click to remove.</div>

<div id="status">
  <div id="conn" class="down">&#9679; disconnected</div>
  <div id="simstats"></div>
  <div id="log"></div>
</div>

<div id="toolbar">
  <button id="clear">Clear all</button>
  <button id="start" disabled>&#9654; Start<br>simulation</button>
</div>

<!-- Drive phase (hidden during setup) -->
<canvas id="view"></canvas>
<div id="countdown"></div>
<button id="abort">&#10005; Abort (Esc)</button>
<div id="done"><div class="box">
  <div class="title">Simulation complete</div>
  <div id="done-info"></div>
  <button id="back">Back to setup</button>
</div></div>

<script>
// ===================== CONFIG =====================
const WS_URL = "ws://localhost:8765";   // backend WebSocket URL
const RECONNECT_MS = 2000;
const LANE_WIDTH_M = 3.5;               // real-world lane width
const LANE_WIDTH_PX = 110;              // lane width on screen
const PIXELS_PER_METER = LANE_WIDTH_PX / LANE_WIDTH_M;   // the ONE scale constant
const LOG_LINES = 10;

// Real-world footprint of each type in meters (w = lateral, l = length). Drawn pointing "up" (ahead).
// Tiny things get a minimum on-screen size so they stay visible/grabbable on a projector.
const TYPES = {
  car:        { w: 1.9, l: 4.5, color: "#e5484d" },
  truck:      { w: 2.5, l: 8.0, color: "#f5a524" },
  bicycle:    { w: 0.7, l: 1.8, color: "#3ecf8e" },
  motorcycle: { w: 0.9, l: 2.2, color: "#b57bff" },
  pedestrian: { w: 0.9, l: 0.9, color: "#4cc2ff" },
};
const EGO_SIZE = { w: 1.9, l: 4.5 };
const EGO_COLOR = "#ffffff";

// ===================== COORDINATE MATH =====================
// World frame: origin = center of the ego car (= center of the viewport).
//   x_m: + to the RIGHT of ego, - to the left.
//   y_m: + AHEAD of ego (screen up), - behind. Screen y grows DOWN, so the sign is flipped.
// All metric values are screen pixels divided by PIXELS_PER_METER.
function egoCenter() { return { x: window.innerWidth / 2, y: window.innerHeight / 2 }; }

function pxToMeters(px, py) {
  const c = egoCenter();
  return { x_m: (px - c.x) / PIXELS_PER_METER,
           y_m: (c.y - py) / PIXELS_PER_METER };   // flipped: up on screen = ahead = positive
}
function metersToPx(x_m, y_m) {
  const c = egoCenter();
  return { x: c.x + x_m * PIXELS_PER_METER, y: c.y - y_m * PIXELS_PER_METER };
}

const ROAD_HALF_M = 1.5 * LANE_WIDTH_M;   // 3 lanes, ego in the middle: road spans +-5.25 m

// Which lane a lateral offset falls in. Center lane spans +-1.75 m around ego.
function laneFromX(x_m) {
  if (x_m < -LANE_WIDTH_M / 2) return "left";
  if (x_m >  LANE_WIDTH_M / 2) return "right";
  return "center";
}

// ZONE RULE (single place to change; e.g. switch to 8 zones here):
//   center lane (same lane as ego): "front" if ahead (y_m >= 0), "rear" if behind (y_m < 0)
//   side lanes: "left" / "right" according to the lane
function classifyZone(lane, y_m) {
  if (lane === "center") return y_m >= 0 ? "front" : "rear";
  return lane;   // "left" or "right"
}

// ===================== WEBSOCKET =====================
let ws = null;
const connEl = document.getElementById("conn");

function setConn(up) {
  connEl.className = up ? "up" : "down";
  connEl.textContent = up ? "● connected" : "● disconnected (retrying every 2s)";
}

function connect() {
  try {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => setConn(true);
    ws.onclose = () => { setConn(false); setTimeout(connect, RECONNECT_MS); };
    ws.onerror = () => {};   // onclose always follows; nothing to do here
  } catch (e) {
    setConn(false);
    setTimeout(connect, RECONNECT_MS);
  }
}

// Send an event. Never throws; if the socket is down it is only logged as "not sent".
// quiet = true skips the log panel (used for the 10 Hz simulation_tick). Returns whether it was sent.
function emit(ev, quiet) {
  let sent = false;
  try {
    if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify(ev)); sent = true; }
  } catch (e) { sent = false; }
  if (!quiet) addLog(ev, sent);
  return sent;
}

// ===================== STATUS LOG =====================
const logEl = document.getElementById("log");
function addLog(ev, sent) {
  const row = document.createElement("div");
  if (!sent) row.className = "unsent";
  row.textContent = (sent ? "✓ " : "✗ NOT SENT ") + JSON.stringify(ev);
  logEl.prepend(row);
  while (logEl.children.length > LOG_LINES) logEl.lastChild.remove();
}

// ===================== ICONS (inline SVG, top-down, front = up) =====================
function svgFor(type, color) {
  const dark = "#1a1d24", glass = "#9fd3ff";
  switch (type) {
    case "car":
      return `<svg viewBox="0 0 40 80" preserveAspectRatio="none">
        <rect x="2" y="2" width="36" height="76" rx="10" fill="${color}" stroke="${dark}" stroke-width="2"/>
        <rect x="7" y="18" width="26" height="12" rx="3" fill="${glass}"/>
        <rect x="7" y="52" width="26" height="9" rx="3" fill="${glass}"/>
        <rect x="9" y="32" width="22" height="18" rx="3" fill="${color}" stroke="${dark}" stroke-width="1"/></svg>`;
    case "truck":
      return `<svg viewBox="0 0 40 80" preserveAspectRatio="none">
        <rect x="3" y="26" width="34" height="52" rx="3" fill="${color}" stroke="${dark}" stroke-width="2"/>
        <rect x="3" y="2" width="34" height="22" rx="7" fill="${color}" stroke="${dark}" stroke-width="2"/>
        <rect x="8" y="7" width="24" height="8" rx="2" fill="${glass}"/></svg>`;
    case "bicycle":
      return `<svg viewBox="0 0 40 80" preserveAspectRatio="none">
        <rect x="18" y="4" width="4" height="72" rx="2" fill="${dark}"/>
        <rect x="6" y="16" width="28" height="4" rx="2" fill="${dark}"/>
        <ellipse cx="20" cy="42" rx="10" ry="12" fill="${color}" stroke="${dark}" stroke-width="2"/>
        <circle cx="20" cy="40" r="6" fill="${dark}"/></svg>`;
    case "motorcycle":
      return `<svg viewBox="0 0 40 80" preserveAspectRatio="none">
        <rect x="14" y="2" width="12" height="76" rx="6" fill="${dark}"/>
        <rect x="3" y="16" width="34" height="5" rx="2" fill="${dark}"/>
        <ellipse cx="20" cy="44" rx="12" ry="14" fill="${color}" stroke="${dark}" stroke-width="2"/>
        <circle cx="20" cy="40" r="6" fill="${dark}"/></svg>`;
    case "pedestrian":
      return `<svg viewBox="0 0 40 40" preserveAspectRatio="none">
        <ellipse cx="20" cy="22" rx="17" ry="9" fill="${color}" stroke="${dark}" stroke-width="2"/>
        <circle cx="20" cy="20" r="8" fill="#f1d3b0" stroke="${dark}" stroke-width="2"/></svg>`;
  }
}

// ===================== SCENE SETUP =====================
const scene = document.getElementById("scene");
const road = document.getElementById("road");
const toolbar = document.getElementById("toolbar");
const egoRing = document.getElementById("ego-ring");

// Ego car: fixed, never moves
const ego = document.createElement("div");
ego.id = "ego";
ego.className = "obj";
ego.innerHTML = svgFor("car", EGO_COLOR);
scene.appendChild(ego);

// Toolbar icons
for (const type of Object.keys(TYPES)) {
  const btn = document.createElement("div");
  btn.className = "tool";
  btn.innerHTML = svgFor(type, TYPES[type].color) + `<span>${type}</span>`;
  btn.addEventListener("pointerdown", e => startDrag(e, btn, type, null));
  toolbar.insertBefore(btn, document.getElementById("clear"));
}

// A few static grass tufts (decorative only)
for (let i = 0; i < 16; i++) {
  const t = document.createElement("div");
  t.className = "tuft";
  t.dataset.fx = ((i * 0.37 + 0.11) % 1).toFixed(3);   // deterministic pseudo-random spots
  t.dataset.fy = ((i * 0.61 + 0.05) % 1).toFixed(3);
  scene.insertBefore(t, road);
}

function sizePx(w_m, l_m) {
  // Real size in px, with a minimum so small objects stay visible.
  return { w: Math.max(w_m * PIXELS_PER_METER, 22), h: Math.max(l_m * PIXELS_PER_METER, 22) };
}

function setBox(el, w_m, l_m) {
  const s = sizePx(w_m, l_m);
  el.style.width = s.w + "px";
  el.style.height = s.h + "px";
}

function layout() {
  const c = egoCenter();
  const roadW = 3 * LANE_WIDTH_PX;
  road.style.width = roadW + "px";
  road.style.left = (c.x - roadW / 2 - 5) + "px";   // -5: left border width
  for (const t of document.querySelectorAll(".tuft")) {
    const fx = parseFloat(t.dataset.fx), fy = parseFloat(t.dataset.fy);
    // Put tufts on the grass: left or right of the road alternately
    const side = fx < 0.5 ? fx * 2 * (c.x - roadW / 2 - 30) : c.x + roadW / 2 + 20 + (fx - 0.5) * 2 * (c.x - roadW / 2 - 40);
    t.style.left = Math.max(0, side) + "px";
    t.style.top = (fy * (window.innerHeight - 150)) + "px";
  }
  setBox(ego, EGO_SIZE.w, EGO_SIZE.l);
  ego.style.left = c.x + "px"; ego.style.top = c.y + "px";
  const s = sizePx(EGO_SIZE.w, EGO_SIZE.l);
  egoRing.style.width = (s.w + 16) + "px"; egoRing.style.height = (s.h + 16) + "px";
  egoRing.style.left = c.x + "px"; egoRing.style.top = c.y + "px";
  for (const o of objects.values()) positionObj(o);
}

// ===================== PLACED OBJECTS =====================
const objects = new Map();   // object_id -> { id, type, x_m, y_m, el }
let nextId = 1;

function positionObj(o) {
  const p = metersToPx(o.x_m, o.y_m);
  o.el.style.left = p.x + "px";
  o.el.style.top = p.y + "px";
}

function buildEvent(name, o) {
  if (name === "object_removed") {
    return { event: name, object_id: o.id, timestamp: Date.now() / 1000 };
  }
  const lane = laneFromX(o.x_m);
  const round = (v, d) => Math.round(v * 10 ** d) / 10 ** d;
  return {
    event: name,                                       // "object_appeared" | "object_moved"
    object_id: o.id,
    type: o.type,
    zone: classifyZone(lane, o.y_m),
    lane: lane,
    distance_m: round(Math.hypot(o.x_m, o.y_m), 1),    // straight-line distance to ego center
    x_m: round(o.x_m, 2),
    y_m: round(o.y_m, 2),
    timestamp: Date.now() / 1000,
  };
}

function removeObject(o) {
  o.el.remove();
  objects.delete(o.id);
  emit(buildEvent("object_removed", o));
  updateStartButton();
}

// "Start simulation" is only possible once at least one object is placed.
function updateStartButton() {
  document.getElementById("start").disabled = objects.size === 0;
}

function createObject(type, x_m, y_m) {
  const id = "obj_" + nextId++;
  const el = document.createElement("div");
  el.className = "obj";
  el.innerHTML = svgFor(type, TYPES[type].color);
  setBox(el, TYPES[type].w, TYPES[type].l);
  scene.appendChild(el);
  const o = { id, type, x_m, y_m, el };
  objects.set(id, o);
  positionObj(o);
  el.addEventListener("pointerdown", e => { if (e.button === 0) startDrag(e, el, type, o); });
  el.addEventListener("contextmenu", e => { e.preventDefault(); removeObject(o); });
  el.addEventListener("dblclick", () => { if (objects.has(o.id)) removeObject(o); });
  updateStartButton();
  return o;
}

// ===================== DRAGGING (pointer events) =====================
// A drop is valid only inside the three-lane road and above the toolbar.
function isValidDrop(px, py) {
  const m = pxToMeters(px, py);
  const aboveToolbar = py < toolbar.getBoundingClientRect().top && py >= 0;
  return aboveToolbar && Math.abs(m.x_m) <= ROAD_HALF_M;
}

// source: element that receives pointer capture; type: object type; existing: placed object or null.
function startDrag(e, source, type, existing) {
  if (e.button !== 0) return;
  e.preventDefault();
  source.setPointerCapture(e.pointerId);

  let ghost = null;
  let offX = 0, offY = 0;                  // grab offset so a moved object doesn't jump
  const startX = e.clientX, startY = e.clientY;
  let moved = false;
  const orig = existing ? { x_m: existing.x_m, y_m: existing.y_m } : null;

  if (existing) {
    const p = metersToPx(existing.x_m, existing.y_m);
    offX = p.x - e.clientX; offY = p.y - e.clientY;
    existing.el.classList.add("dragging");
  } else {
    ghost = document.createElement("div");
    ghost.className = "ghost";
    ghost.innerHTML = svgFor(type, TYPES[type].color);
    setBox(ghost, TYPES[type].w, TYPES[type].l);
    document.body.appendChild(ghost);
    ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px";
  }

  function onMove(ev) {
    if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > 3) moved = true;
    const px = ev.clientX + offX, py = ev.clientY + offY;
    if (existing) {
      const m = pxToMeters(px, py);
      existing.x_m = m.x_m; existing.y_m = m.y_m;
      positionObj(existing);
    } else {
      ghost.style.left = px + "px"; ghost.style.top = py + "px";
      ghost.classList.toggle("bad", !isValidDrop(px, py));
    }
  }

  function finish(ev, cancelled) {
    source.removeEventListener("pointermove", onMove);
    source.removeEventListener("pointerup", onUp);
    source.removeEventListener("pointercancel", onCancel);
    if (source.hasPointerCapture(ev.pointerId)) source.releasePointerCapture(ev.pointerId);
    const px = ev.clientX + offX, py = ev.clientY + offY;
    const ok = !cancelled && isValidDrop(px, py);

    if (existing) {
      existing.el.classList.remove("dragging");
      if (!moved || !ok) {                          // plain click, or dropped somewhere invalid: revert
        existing.x_m = orig.x_m; existing.y_m = orig.y_m;
        positionObj(existing);
      } else {
        emit(buildEvent("object_moved", existing));
      }
    } else {
      ghost.remove();
      if (ok) {
        const m = pxToMeters(px, py);
        const o = createObject(type, m.x_m, m.y_m);
        emit(buildEvent("object_appeared", o));
      }
    }
  }
  function onUp(ev) { finish(ev, false); }
  function onCancel(ev) { finish(ev, true); }

  source.addEventListener("pointermove", onMove);
  source.addEventListener("pointerup", onUp);
  source.addEventListener("pointercancel", onCancel);
}

// ===================== MISC =====================
scene.addEventListener("contextmenu", e => e.preventDefault());   // no browser menu on the road

document.getElementById("clear").addEventListener("click", () => {
  for (const o of [...objects.values()]) removeObject(o);          // one object_removed per object
});

// =====================================================================================
// ============================ DRIVE PHASE (first-person) ============================
// =====================================================================================
//
// COORDINATE CONVENTIONS — identical to setup, and used by EVERY payload:
//   origin = center of the ego car, on the road surface
//   x_m    = lateral meters,  + right of ego, - left.  Center lane |x| <= 1.75, side lanes beyond.
//   y_m    = forward meters,  + ahead of ego, - behind.
//   z      = meters above the road (rendering only, never sent).
// The ego car never moves, so every speed is both "relative to us" and "over the ground".
// The camera positions below (driver's eye, mirrors) are used only for drawing and for visible_in;
// they never shift the x_m / y_m that go out over the WebSocket.

// ------------------------------ BEHAVIOR TABLE ---------------------------------------
// The one place to tweak how things move during DRIVING.
//
//   type in SIDE lane (left/right), kind "vehicle"  -> mode "overtake":
//        drives straight ahead (+y) at speed_mps, keeps its lateral x. FINISHED once y_m >= 80
//        (sends object_passed, reason "overtook"). It keeps driving away afterwards so the
//        picture and the tick payload never disagree; it just stops counting for the end check.
//   type in CENTER lane, kind "vehicle"             -> mode "parked":
//        never moves. FINISHED immediately. Sends NO object_passed (it neither overtook nor crossed).
//   kind "pedestrian", any lane                      -> mode "cross":
//        teleported at start onto the grass on the side it was placed nearer to, then walks
//        laterally (constant y_m) to the grass on the far side. FINISHED there (reason "crossed"),
//        then stands still.
const BEHAVIOR = {
  car:        { kind: "vehicle",    speed_mps: 12 },
  motorcycle: { kind: "vehicle",    speed_mps: 16 },
  truck:      { kind: "vehicle",    speed_mps: 9 },
  bicycle:    { kind: "vehicle",    speed_mps: 5 },
  pedestrian: { kind: "pedestrian", speed_mps: 1.4 },
};
const SPEED_JITTER = 0.10;        // each object gets speed * (1 +- up to 10%), re-rolled every run
const OVERTAKE_DONE_Y_M = 80;     // side-lane vehicle is FINISHED this far ahead of ego
const PED_GRASS_OFFSET_M = 1.5;   // pedestrian start/end point: this far outside the road edge
const COUNTDOWN_S = 3;            // "3, 2, 1" (world frozen), then GO
const END_DELAY_S = 3;            // after the last object finishes, keep running this long, then freeze
const TICK_HZ = 10;               // simulation_tick rate (independent of the render frame rate)

function planBehavior(src) {     // src = a placed setup object; returns a NEW sim object (setup is untouched)
  const b = BEHAVIOR[src.type];
  const jitter = 1 + (Math.random() * 2 - 1) * SPEED_JITTER;
  const o = { id: src.id, type: src.type, x_m: src.x_m, y_m: src.y_m,
              mode: "parked", cruise: 0, speed: 0, targetX: src.x_m, finished: false,
              walked: 0,          // meters walked, only drives the leg animation
              vis: {} };          // view name -> bool, rewritten by every rendered frame
  if (b.kind === "pedestrian") {
    const side = src.x_m <= 0 ? -1 : 1;                      // nearer road edge (tie -> left)
    const edge = ROAD_HALF_M + PED_GRASS_OFFSET_M;
    o.mode = "cross"; o.x_m = side * edge; o.targetX = -side * edge;
    o.cruise = o.speed = b.speed_mps * jitter;
  } else if (laneFromX(src.x_m) !== "center") {
    o.mode = "overtake"; o.cruise = o.speed = b.speed_mps * jitter;
  } else {
    o.mode = "parked"; o.finished = true;
  }
  return o;
}

// Advance one object by dt seconds. Returns the object_passed reason on the frame it finishes, else null.
function stepObject(o, dt) {
  if (o.mode === "overtake") {
    o.y_m += o.cruise * dt;
    if (!o.finished && o.y_m >= OVERTAKE_DONE_Y_M) { o.finished = true; return "overtook"; }
  } else if (o.mode === "cross" && !o.finished) {
    const left = Math.abs(o.targetX - o.x_m), step = o.cruise * dt;
    if (left <= step) {
      o.x_m = o.targetX; o.walked += left; o.finished = true; o.speed = 0;
      return "crossed";
    }
    o.x_m += Math.sign(o.targetX - o.x_m) * step; o.walked += step;
  }
  return null;
}

// ------------------------------ CAMERAS ----------------------------------------------
const EYE = { x: -0.35, y: 0.0, z: 1.2 };  // driver's eye: left-hand drive, so a bit left of the car's center
const FOV_DEG = 75;                         // horizontal field of view of the windshield camera
const HORIZON_FRAC = 0.42;                  // horizon line at 42% of screen height (more room for road;
                                            // equivalent to a lens shift, the projection stays a pinhole)
const NEAR_SPRITE_M = 0.5;                  // objects closer than this to a camera are not drawn by it
const NEAR_GROUND_M = 0.3;                  // near clipping plane for road polygons

// Mirror cameras sit at the mirror glass and look BACKWARD (see toCam for the axis handling).
// aimDeg angles a side mirror outward so the left mirror mostly shows the left lane behind us.
const MIRROR_CAMS = {
  mirror_center: { x: 0.0,   y: 0.5, z: 1.3, fovDeg: 40, aimDeg: 0 },
  mirror_left:   { x: -0.95, y: 0.7, z: 1.0, fovDeg: 30, aimDeg: -12 },
  mirror_right:  { x: 0.95,  y: 0.7, z: 1.0, fovDeg: 30, aimDeg: 12 },
};
const VIEW_NAMES = ["windshield", "mirror_center", "mirror_left", "mirror_right"];
const VIEW_ABBR = { windshield: "W", mirror_center: "C", mirror_left: "L", mirror_right: "R" };

// Real-world size of each sprite in the first-person view, meters (w = width, h = height).
// Length for "which face points at the camera" comes from TYPES[type].l.
const SPRITE = {
  car:        { w: 1.9, h: 1.45 },
  truck:      { w: 2.5, h: 3.6 },
  bicycle:    { w: 0.6, h: 1.75 },   // incl. rider
  motorcycle: { w: 0.8, h: 1.55 },   // incl. rider
  pedestrian: { w: 0.5, h: 1.75 },
};

// Road markings (meters)
const EDGE_LINE_W = 0.2, DASH_W = 0.15, DASH_LEN = 3, DASH_GAP = 6, DASH_RANGE = 300;
const POST_SPACING = 25, POST_RANGE = 300;   // roadside delineator posts, for depth cues

// ------------------------------ PROJECTION -------------------------------------------
// A "view" is one virtual pinhole camera plus the canvas rectangle it paints into:
//   { name, camX, camY, camZ, back, aim, focal, cx, horizonY, clip: {x, y, w, h} }
//
// Step 1 — toCam(): world (x, y) -> camera frame (lat, depth)
//   Windshield (back = false):
//       depth = y - camY       meters in front of the camera
//       lat   = x - camX       meters to the camera's right
//   Mirror (back = true): the camera is turned around to look behind us.
//       depth = camY - y       "in front of the mirror camera" now means BEHIND the car
//       lat   = x - camX       <- deliberately NOT negated. Turning a camera around flips left/right
//                                 (something on our left would land on the right of the image), and a
//                                 mirror flips left/right once more. The two flips cancel, so an object
//                                 behind us on the LEFT (x < 0) is drawn on the LEFT of every mirror —
//                                 exactly what a driver sees.
//   aim (side mirrors only): the glass is angled outward, so we rotate (lat, depth) by `aim` radians
//       in the ground plane. aim < 0 swings the view toward the left lane, aim > 0 toward the right.
//       With aim = 0 it is just the plain turned-around camera.
// Step 2 — pinhole projection, focal length in pixels:
//       focal    = (view_width / 2) / tan(fov_horizontal / 2)
//       scale    = focal / depth                      pixels per meter at that depth (sprite_scale)
//       screen_x = cx       + lat * scale             (= cx + (lat / depth) * focal)
//       screen_y = horizonY + (camZ - z) * scale      z = 0 is the road; z > camZ draws above the horizon
function toCam(v, x, y) {
  let lat = x - v.camX;
  let depth = v.back ? v.camY - y : y - v.camY;
  if (v.aim) {
    const c = Math.cos(v.aim), s = Math.sin(v.aim);
    const lat2 = lat * c - depth * s;
    depth = lat * s + depth * c;
    lat = lat2;
  }
  return { lat, depth };
}

// Project the ground point under an object. null if it is behind / too close to this camera.
function projectBase(v, x, y) {
  const p = toCam(v, x, y);
  if (p.depth <= NEAR_SPRITE_M) return null;
  const scale = v.focal / p.depth;
  return { depth: p.depth, scale, sx: v.cx + p.lat * scale, sy: v.horizonY + v.camZ * scale };
}

// Fill a flat rectangle on the road (x0..x1, y0..y1, z = 0). The polygon is first clipped against the
// camera's near plane (one-plane Sutherland-Hodgman) so a quad that starts behind the camera and runs
// far ahead still projects to a correct trapezoid. Clipping in camera space is valid because toCam is
// a rotation + translation, so straight lines stay straight.
function groundQuad(c, v, x0, y0, x1, y1) {
  const pts = [toCam(v, x0, y0), toCam(v, x1, y0), toCam(v, x1, y1), toCam(v, x0, y1)];
  const out = [];
  for (let i = 0; i < 4; i++) {
    const a = pts[i], b = pts[(i + 1) % 4];
    const aIn = a.depth >= NEAR_GROUND_M, bIn = b.depth >= NEAR_GROUND_M;
    if (aIn) out.push(a);
    if (aIn !== bIn) {
      const t = (NEAR_GROUND_M - a.depth) / (b.depth - a.depth);
      out.push({ lat: a.lat + t * (b.lat - a.lat), depth: NEAR_GROUND_M });
    }
  }
  if (out.length < 3) return;
  c.beginPath();
  for (let i = 0; i < out.length; i++) {
    const s = v.focal / out[i].depth;
    const sx = v.cx + out[i].lat * s, sy = v.horizonY + v.camZ * s;
    if (i === 0) c.moveTo(sx, sy); else c.lineTo(sx, sy);
  }
  c.closePath();
  c.fill();
}

// ------------------------------ SPRITES ----------------------------------------------
const INK = "#14161b", GLASS = "#9fd3ff", SKIN = "#f1d3b0", CLOTH = "#2b2f3a";

function rr(c, x, y, w, h, r) {   // rounded-rect path
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);         c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function fillOutlined(c, fill, lw) { c.fillStyle = fill; c.fill(); c.lineWidth = lw; c.strokeStyle = INK; c.stroke(); }
function line(c, x0, y0, x1, y1) { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); }
function dot(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0.5, r), 0, 2 * Math.PI); }

// Draw one object with its bottom-center at (sx, sy) and size w x h pixels.
// front = true: we see the object's front (mirrors); false: its rear (windshield).
function drawSprite(c, type, sx, sy, w, h, color, front, walked) {
  const x0 = sx - w / 2, top = sy - h, lw = Math.max(1, w * 0.025);
  const lamp = front ? "#fff4b8" : "#ff2a2a";
  c.lineCap = "round";
  c.fillStyle = "rgba(0,0,0,.35)";                                   // ground shadow
  c.beginPath(); c.ellipse(sx, sy, w * 0.6, Math.max(1, h * 0.05), 0, 0, 2 * Math.PI); c.fill();

  switch (type) {
    case "car":
      c.fillStyle = INK;                                              // tyres
      c.fillRect(x0 + w * 0.05, sy - h * 0.2, w * 0.2, h * 0.2);
      c.fillRect(x0 + w * 0.75, sy - h * 0.2, w * 0.2, h * 0.2);
      rr(c, x0 + w * 0.14, top, w * 0.72, h * 0.5, w * 0.12); fillOutlined(c, color, lw);   // cabin
      rr(c, x0 + w * 0.2, top + h * 0.07, w * 0.6, h * 0.34, w * 0.07); c.fillStyle = GLASS; c.fill();
      rr(c, x0, sy - h * 0.62, w, h * 0.47, w * 0.1); fillOutlined(c, color, lw);           // body
      c.fillStyle = lamp;
      rr(c, x0 + w * 0.05, sy - h * 0.53, w * 0.18, h * 0.1, w * 0.03); c.fill();
      rr(c, x0 + w * 0.77, sy - h * 0.53, w * 0.18, h * 0.1, w * 0.03); c.fill();
      c.fillStyle = front ? INK : "#f2f2f2";                          // grille / number plate
      c.fillRect(sx - w * 0.13, sy - h * 0.36, w * 0.26, h * 0.09);
      break;

    case "truck":
      c.fillStyle = INK;
      c.fillRect(x0 + w * 0.04, sy - h * 0.12, w * 0.22, h * 0.12);
      c.fillRect(x0 + w * 0.74, sy - h * 0.12, w * 0.22, h * 0.12);
      if (front) {                                                    // cab, big windshield
        rr(c, x0, top + h * 0.04, w, h * 0.84, w * 0.08); fillOutlined(c, color, lw);
        rr(c, x0 + w * 0.08, top + h * 0.12, w * 0.84, h * 0.3, w * 0.04); c.fillStyle = GLASS; c.fill();
        c.fillStyle = INK; c.fillRect(x0 + w * 0.25, sy - h * 0.42, w * 0.5, h * 0.18);
        c.fillStyle = lamp;
        c.fillRect(x0 + w * 0.05, sy - h * 0.3, w * 0.15, h * 0.07);
        c.fillRect(x0 + w * 0.8, sy - h * 0.3, w * 0.15, h * 0.07);
      } else {                                                        // cargo box, rear doors
        rr(c, x0, top, w, h * 0.86, w * 0.03); fillOutlined(c, color, lw);
        c.strokeStyle = INK; c.lineWidth = lw; line(c, sx, top + h * 0.03, sx, top + h * 0.83);
        c.fillStyle = INK; c.fillRect(x0, sy - h * 0.17, w, h * 0.06);   // bumper
        c.fillStyle = lamp;
        c.fillRect(x0 + w * 0.03, sy - h * 0.26, w * 0.12, h * 0.06);
        c.fillRect(x0 + w * 0.85, sy - h * 0.26, w * 0.12, h * 0.06);
      }
      break;

    case "bicycle":
    case "motorcycle": {
      const moto = type === "motorcycle";
      const tyreW = w * (moto ? 0.24 : 0.14);
      rr(c, sx - tyreW / 2, sy - h * 0.4, tyreW, h * 0.4, tyreW / 2); c.fillStyle = INK; c.fill();   // wheel, edge-on
      if (moto) { rr(c, sx - w * 0.32, sy - h * 0.58, w * 0.64, h * 0.24, w * 0.12); fillOutlined(c, color, lw); }
      c.fillStyle = INK; c.fillRect(x0 + w * 0.04, sy - h * 0.55, w * 0.92, Math.max(1, h * 0.03));   // handlebar
      c.strokeStyle = CLOTH; c.lineWidth = Math.max(1, w * 0.14);                                       // legs
      line(c, sx - w * 0.13, sy - h * 0.5, sx - w * 0.17, sy - h * 0.18);
      line(c, sx + w * 0.13, sy - h * 0.5, sx + w * 0.17, sy - h * 0.22);
      rr(c, sx - w * 0.3, top + h * 0.17, w * 0.6, h * 0.38, w * 0.2);                                // torso
      fillOutlined(c, moto ? CLOTH : color, lw);
      c.strokeStyle = moto ? CLOTH : color; c.lineWidth = Math.max(1, w * 0.12);                       // arms
      line(c, sx - w * 0.26, top + h * 0.25, x0 + w * 0.08, sy - h * 0.53);
      line(c, sx + w * 0.26, top + h * 0.25, x0 + w * 0.92, sy - h * 0.53);
      dot(c, sx, top + h * 0.09, w * (moto ? 0.22 : 0.17)); fillOutlined(c, moto ? color : SKIN, lw);  // head / helmet
      if (moto) { c.fillStyle = INK; c.fillRect(sx - w * 0.15, top + h * 0.07, w * 0.3, h * 0.04); }   // visor
      dot(c, sx, sy - h * 0.45, w * 0.08); c.fillStyle = lamp; c.fill();
      break;
    }

    case "pedestrian": {                      // side view, walking: legs/arms swing with distance walked
      const swing = Math.sin(walked * 3.2) * w * 0.45;
      const hipY = sy - h * 0.47, neckY = top + h * 0.2;
      c.strokeStyle = CLOTH; c.lineWidth = Math.max(1, w * 0.24);
      line(c, sx, hipY, sx + swing, sy); line(c, sx, hipY, sx - swing, sy);
      c.strokeStyle = INK; c.lineWidth = Math.max(2, w * 0.55 + 2 * lw); line(c, sx, neckY + w * 0.2, sx, hipY);
      c.strokeStyle = color; c.lineWidth = Math.max(1, w * 0.55);     line(c, sx, neckY + w * 0.2, sx, hipY);
      c.strokeStyle = SKIN; c.lineWidth = Math.max(1, w * 0.15);
      line(c, sx, neckY + h * 0.03, sx - swing * 0.8, hipY + h * 0.02);
      line(c, sx, neckY + h * 0.03, sx + swing * 0.8, hipY + h * 0.02);
      dot(c, sx, top + h * 0.08, h * 0.075); fillOutlined(c, SKIN, lw);
      break;
    }
  }
}

function drawLabel(c, text, x, y, px) {
  c.font = `bold ${px}px system-ui, "Segoe UI", Arial, sans-serif`;
  c.textAlign = "center"; c.textBaseline = "bottom";
  c.lineWidth = 3; c.strokeStyle = "rgba(0,0,0,.85)"; c.strokeText(text, x, y - 3);
  c.fillStyle = "#fff"; c.fillText(text, x, y - 3);
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ------------------------------ SCENE ------------------------------------------------
// Draw sky, ground, road and objects for one view, and record per object whether this view shows it.
function drawWorld(c, v, objs) {
  const { x, y, w, h } = v.clip;
  const sky = c.createLinearGradient(0, y, 0, v.horizonY);
  sky.addColorStop(0, "#6fa8dc"); sky.addColorStop(1, "#d4e9f6");
  c.fillStyle = sky; c.fillRect(x, y, w, v.horizonY - y);
  const treeLine = Math.max(2, v.focal * 0.012);
  c.fillStyle = "#2e5a34"; c.fillRect(x, v.horizonY - treeLine, w, treeLine);
  c.fillStyle = "#4a8a3f"; c.fillRect(x, v.horizonY, w, y + h - v.horizonY);

  // Road as one long quad (both directions; each camera's near-plane clip keeps only its half),
  // then solid edge lines and dashed lane lines.
  const R = ROAD_HALF_M, FAR = 3000;
  c.fillStyle = "#3b3e45"; groundQuad(c, v, -R, -FAR, R, FAR);
  c.fillStyle = "#f4f4f4";
  groundQuad(c, v, -R, -FAR, -R + EDGE_LINE_W, FAR);
  groundQuad(c, v, R - EDGE_LINE_W, -FAR, R, FAR);
  for (const lx of [-LANE_WIDTH_M / 2, LANE_WIDTH_M / 2]) {
    for (let yy = -DASH_RANGE; yy < DASH_RANGE; yy += DASH_LEN + DASH_GAP) {
      groundQuad(c, v, lx - DASH_W / 2, yy, lx + DASH_W / 2, yy + DASH_LEN);
    }
  }

  // Delineator posts, far to near.
  for (let i = 0; i <= (2 * POST_RANGE) / POST_SPACING; i++) {
    const yy = v.back ? -POST_RANGE + i * POST_SPACING : POST_RANGE - i * POST_SPACING;
    for (const side of [-1, 1]) {
      const p = projectBase(v, side * (R + 1.2), yy);
      if (!p || p.scale < 2) continue;
      const pw = Math.max(1, 0.15 * p.scale), ph = 1.0 * p.scale;
      c.fillStyle = "#eeeeee"; c.fillRect(p.sx - pw / 2, p.sy - ph, pw, ph);
      c.fillStyle = "#111";    c.fillRect(p.sx - pw / 2, p.sy - ph * 0.85, pw, ph * 0.15);
    }
  }

  // Objects. Each is a flat billboard standing on the face that points at this camera:
  // its rear (y - length/2) in the windshield, its front (y + length/2) in a mirror.
  const list = [];
  for (const o of objs) {
    o.vis[v.name] = false;
    const half = o.type === "pedestrian" ? 0 : TYPES[o.type].l / 2;
    const p = projectBase(v, o.x_m, v.back ? o.y_m + half : o.y_m - half);
    if (p) list.push({ o, p });
  }
  list.sort((a, b) => b.p.depth - a.p.depth);                 // far to near: nearer ones overlap
  for (const { o, p } of list) {
    const pw = SPRITE[o.type].w * p.scale, ph = SPRITE[o.type].h * p.scale;
    drawSprite(c, o.type, p.sx, p.sy, pw, ph, TYPES[o.type].color, v.back, o.walked);
    // visible_in comes from exactly this rectangle: the sprite's on-screen box after projection,
    // tested against what is really open glass for this view.
    const box = { x: p.sx - pw / 2, y: p.sy - ph, w: pw, h: ph };
    o.vis[v.name] = v.back ? rectsOverlap(box, v.clip) : windshieldSees(box);
    if (ph > 22) drawLabel(c, o.id, p.sx, p.sy - ph, v.back ? 11 : 16);
  }
}

// ------------------------------ COCKPIT & MIRRORS ------------------------------------
// Static cockpit overlay. Also drawn once into an offscreen "occlusion mask" (see buildMask), so
// whatever this function covers really hides objects for visible_in.
function drawCockpit(c, W, H) {
  const body = "#16181d", dash = "#23262e", rim = "#0b0c0f";
  c.fillStyle = body;
  c.fillRect(0, 0, W, H * 0.035);                            // roof liner
  // A-pillars: slanted bars, leaning inward toward the roof. Outside each bar is side-window glass.
  // The right one is farther from the (left-seated) driver, so it looks thinner.
  c.beginPath(); c.moveTo(0, H * 0.82); c.lineTo(W * 0.075, H * 0.82); c.lineTo(W * 0.175, 0); c.lineTo(W * 0.105, 0);
  c.closePath(); c.fill();
  c.beginPath(); c.moveTo(W, H * 0.82); c.lineTo(W * 0.945, H * 0.82); c.lineTo(W * 0.85, 0); c.lineTo(W * 0.9, 0);
  c.closePath(); c.fill();
  // Dashboard across the bottom, with an instrument hood behind the wheel.
  c.fillStyle = dash;
  c.beginPath(); c.moveTo(0, H * 0.8); c.quadraticCurveTo(W / 2, H * 0.73, W, H * 0.8);
  c.lineTo(W, H); c.lineTo(0, H); c.closePath(); c.fill();
  c.fillStyle = body;
  c.beginPath(); c.ellipse(W / 2, H * 0.79, W * 0.12, H * 0.06, 0, Math.PI, 2 * Math.PI); c.fill();
  // Steering wheel: rim + two spokes; the hub is below the screen.
  const r = H * 0.36, wy = H * 1.08;
  c.strokeStyle = rim; c.lineCap = "butt";
  c.lineWidth = H * 0.045; c.beginPath(); c.arc(W / 2, wy, r, 0, 2 * Math.PI); c.stroke();
  c.lineWidth = H * 0.05;
  c.beginPath(); c.moveTo(W / 2 - r * 0.93, wy - r * 0.35); c.lineTo(W / 2, wy); c.lineTo(W / 2 + r * 0.93, wy - r * 0.35); c.stroke();
}

// Mirror layout on screen (glass rectangles, CSS px). body = which edge shows our own car's flank.
function mirrorRects(W, H) {
  const cw = Math.min(560, Math.max(220, W * 0.24)), ch = cw * 0.27;
  const sw = Math.min(300, Math.max(120, W * 0.13)), sh = sw * 0.6, m = W * 0.012;
  return {
    mirror_center: { x: W / 2 - cw / 2, y: H * 0.05,  w: cw, h: ch, body: 0 },
    mirror_left:   { x: m,              y: H * 0.545, w: sw, h: sh, body: +1 },  // flank on its inner (right) edge
    mirror_right:  { x: W - m - sw,     y: H * 0.545, w: sw, h: sh, body: -1 },  // flank on its inner (left) edge
  };
}

function drawMirrorHousing(c, m) {   // opaque frame (and stem) behind the glass
  const g = m.glass, pad = 5;
  c.fillStyle = "#0d0e11";
  if (m.name === "mirror_center") c.fillRect(g.x + g.w / 2 - 8, 0, 16, g.y);
  rr(c, g.x - pad, g.y - pad, g.w + 2 * pad, g.h + 2 * pad, 10);
  c.fill(); c.lineWidth = 2; c.strokeStyle = "#5a5f6b"; c.stroke();
}

function drawMirrorGlass(c, m) {     // our car's flank, dark tint, thin inner border
  const g = m.glass;
  if (g.body) {
    const bx = g.body > 0 ? g.x + g.w - m.bodyW : g.x;
    c.fillStyle = "#c8ccd4"; c.fillRect(bx, g.y, m.bodyW, g.h);
    c.fillStyle = "#9aa0aa"; c.fillRect(bx, g.y + g.h * 0.55, m.bodyW, g.h * 0.07);
    c.fillStyle = INK;       c.fillRect(g.body > 0 ? bx : bx + m.bodyW - 2, g.y, 2, g.h);
  }
  c.fillStyle = "rgba(10,20,40,.22)"; c.fillRect(g.x, g.y, g.w, g.h);
  c.lineWidth = 1; c.strokeStyle = "rgba(255,255,255,.35)"; c.strokeRect(g.x + 0.5, g.y + 0.5, g.w - 1, g.h - 1);
}

// ------------------------------ VIEW GEOMETRY & VISIBILITY ---------------------------
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
let VW = null;   // { W, H, main, mirrors, mask }, rebuilt on resize

function rad(d) { return (d * Math.PI) / 180; }

function resizeView() {
  const W = window.innerWidth, H = window.innerHeight, dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);                     // draw in CSS pixels
  const main = { name: "windshield", camX: EYE.x, camY: EYE.y, camZ: EYE.z, back: false, aim: 0,
    focal: (W / 2) / Math.tan(rad(FOV_DEG) / 2), cx: W / 2, horizonY: H * HORIZON_FRAC,
    clip: { x: 0, y: 0, w: W, h: H } };
  const rects = mirrorRects(W, H);
  const mirrors = Object.keys(MIRROR_CAMS).map(name => {
    const m = MIRROR_CAMS[name], g = rects[name], bodyW = g.body ? g.w * 0.2 : 0;
    return { name, camX: m.x, camY: m.y, camZ: m.z, back: true, aim: rad(m.aimDeg),
      focal: (g.w / 2) / Math.tan(rad(m.fovDeg) / 2), cx: g.x + g.w / 2, horizonY: g.y + g.h * 0.45,
      glass: g, bodyW,
      clip: { x: g.body < 0 ? g.x + bodyW : g.x, y: g.y, w: g.w - bodyW, h: g.h } };  // glass minus our flank
  });
  VW = { W, H, main, mirrors, mask: buildMask(W, H, mirrors) };
}

// Occlusion mask for the windshield: the cockpit and the mirror housings drawn once, opaque, into an
// offscreen canvas. A pixel with alpha < 128 is open glass (windshield or front side window).
function buildMask(W, H, mirrors) {
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const c = off.getContext("2d", { willReadFrequently: true });
  drawCockpit(c, W, H);
  for (const m of mirrors) drawMirrorHousing(c, m);
  return c.getImageData(0, 0, W, H).data;
}

// "windshield" visibility: the sprite box, cut by the canvas edge (the frame), must contain at least
// one pixel of open glass, i.e. it is not entirely behind A-pillars, dashboard, wheel or a mirror.
const MASK_STEP = 3;   // sample every 3 px
function windshieldSees(b) {
  const { W, H, mask } = VW;
  const x0 = Math.max(0, Math.floor(b.x)), x1 = Math.min(W - 1, Math.ceil(b.x + b.w));
  const y0 = Math.max(0, Math.floor(b.y)), y1 = Math.min(H - 1, Math.ceil(b.y + b.h));
  if (x0 > x1 || y0 > y1) return false;                       // fully outside the frame
  for (let yy = y0; yy <= y1; yy += MASK_STEP) {
    for (let xx = x0; xx <= x1; xx += MASK_STEP) {
      if (mask[(yy * W + xx) * 4 + 3] < 128) return true;
    }
  }
  return false;
}

function render() {
  const { W, H, main, mirrors } = VW;
  ctx.clearRect(0, 0, W, H);
  drawWorld(ctx, main, sim.objs);                             // 1. outside world through the windshield
  drawCockpit(ctx, W, H);                                     // 2. cockpit on top
  for (const m of mirrors) {                                  // 3. mirrors on top of everything
    drawMirrorHousing(ctx, m);
    ctx.save();
    ctx.beginPath(); ctx.rect(m.clip.x, m.clip.y, m.clip.w, m.clip.h); ctx.clip();
    drawWorld(ctx, m, sim.objs);
    ctx.restore();
    drawMirrorGlass(ctx, m);
  }
}

// ------------------------------ SIMULATION FLOW --------------------------------------
// phases: "countdown" -> "driving" -> "done";  sim === null means we are in SETUP.
let sim = null;
let rafId = 0, lastNow = 0;
const bigEl = document.getElementById("countdown");
const doneEl = document.getElementById("done");
const simStatsEl = document.getElementById("simstats");
const rnd = (v, d) => Math.round(v * 10 ** d) / 10 ** d;

// Position part of every drive-phase object payload. Same helpers + rounding as the setup events,
// and zone/lane are recomputed from the CURRENT position every time.
function describe(o) {
  const lane = laneFromX(o.x_m);
  return { object_id: o.id, type: o.type, zone: classifyZone(lane, o.y_m), lane,
           x_m: rnd(o.x_m, 2), y_m: rnd(o.y_m, 2), distance_m: rnd(Math.hypot(o.x_m, o.y_m), 1) };
}

function setBig(text, go) {
  if (bigEl.textContent !== text) bigEl.textContent = text;
  bigEl.classList.toggle("show", !!text);
  bigEl.classList.toggle("go", !!go);
}

function startSimulation() {
  if (sim || objects.size === 0) return;
  sim = { phase: "countdown", phaseT: 0, t: 0, objs: [...objects.values()].map(planBehavior),
          ticks: 0, unsentTicks: 0, allDoneT: null, tickTimer: 0 };
  document.body.classList.add("sim");
  resizeView();
  setBig(String(COUNTDOWN_S));
  emit({ event: "simulation_started", countdown_s: COUNTDOWN_S, timestamp: Date.now() / 1000,
         objects: sim.objs.map(describe) });
  render();
  updateSimStats();
  lastNow = performance.now();
  rafId = requestAnimationFrame(frame);
}

function beginDriving() {
  sim.phase = "driving"; sim.t = 0;
  sendTick();                                                  // t = 0 snapshot right at GO
  sim.tickTimer = setInterval(sendTick, 1000 / TICK_HZ);       // 10 Hz, decoupled from rendering
}

function endSimulation() {
  sim.phase = "done";                                          // world freezes: update() does nothing now
  clearInterval(sim.tickTimer);
  setBig("");
  emit({ event: "simulation_ended", duration_s: rnd(sim.t, 1), timestamp: Date.now() / 1000, aborted: false });
  document.getElementById("done-info").textContent =
    `${sim.objs.length} object(s), ${sim.t.toFixed(1)} s of driving, ${sim.ticks} ticks`;
  doneEl.classList.add("show");
  updateSimStats();
}

// Back to SETUP. From countdown/driving this is an abort and the backend is told so.
function exitToSetup() {
  if (!sim) return;
  if (sim.phase !== "done") {
    emit({ event: "simulation_ended", duration_s: rnd(sim.t, 1), timestamp: Date.now() / 1000, aborted: true });
  }
  clearInterval(sim.tickTimer);
  cancelAnimationFrame(rafId);
  sim = null;
  setBig("");
  doneEl.classList.remove("show");
  document.body.classList.remove("sim");
  layout();                                                    // setup objects were never touched
}

function update(dt) {
  sim.phaseT += dt;
  if (sim.phase === "countdown") {                             // frozen world, 3..2..1
    setBig(String(Math.max(1, COUNTDOWN_S - Math.floor(sim.phaseT))));
    if (sim.phaseT >= COUNTDOWN_S) beginDriving();
    return;
  }
  if (sim.phase !== "driving") return;
  sim.t += dt;
  setBig(sim.t < 1 ? "GO" : "", true);
  for (const o of sim.objs) {
    const reason = stepObject(o, dt);
    if (reason) emit({ event: "object_passed", object_id: o.id, reason, timestamp: Date.now() / 1000 });
  }
  if (sim.allDoneT === null && sim.objs.every(o => o.finished)) sim.allDoneT = sim.t;
  if (sim.allDoneT !== null && sim.t >= sim.allDoneT + END_DELAY_S) endSimulation();
}

// requestAnimationFrame loop with delta time, so motion is frame-rate independent.
// dt is capped at 0.1 s so a hidden/stalled tab does not make objects jump.
function frame(now) {
  if (!sim) return;
  const dt = Math.min(0.1, Math.max(0, (now - lastNow) / 1000));
  lastNow = now;
  update(dt);
  render();                                                    // also refreshes every o.vis
  rafId = requestAnimationFrame(frame);
}

// 10 Hz batched state. visible_in is read from the most recent rendered frame (o.vis), which used the
// same positions — update() and render() run back to back inside one animation frame.
function sendTick() {
  if (!sim || sim.phase !== "driving") return;
  const ev = {
    event: "simulation_tick",
    t: rnd(sim.t, 2),
    timestamp: Date.now() / 1000,
    objects: sim.objs.map(o => Object.assign(describe(o), {
      speed_mps: rnd(o.speed, 1),
      visible_in: VIEW_NAMES.filter(n => o.vis[n]),
    })),
  };
  sim.ticks++;
  if (!emit(ev, true)) sim.unsentTicks++;                      // ticks are counted, not logged
  updateSimStats();
}

function updateSimStats() {
  if (!sim) return;
  const lines = [
    `phase: ${sim.phase}   t = ${sim.t.toFixed(1)} s`,
    `ticks: ${sim.ticks}` + (sim.unsentTicks ? `  (${sim.unsentTicks} NOT sent)` : ""),
  ];
  for (const o of sim.objs) {
    const vis = VIEW_NAMES.filter(n => o.vis[n]).map(n => VIEW_ABBR[n]).join(" ") || "-";
    lines.push(`${o.id.padEnd(7)}${o.type.padEnd(11)}${describe(o).zone.padEnd(6)}${vis}${o.finished ? "  done" : ""}`);
  }
  simStatsEl.textContent = lines.join("\n");
}

document.getElementById("start").addEventListener("click", startSimulation);
document.getElementById("abort").addEventListener("click", exitToSetup);
document.getElementById("back").addEventListener("click", exitToSetup);
document.addEventListener("keydown", e => { if (e.key === "Escape" && sim) exitToSetup(); });
window.addEventListener("resize", () => { if (sim) { resizeView(); render(); } });

window.addEventListener("resize", layout);
layout();
connect();
updateStartButton();
</script>
</body>
</html>
