<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Driving Scene Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="scene">
  <div id="road">
    <div class="dash" style="left:33.333%"></div>
    <div class="dash" style="left:66.666%"></div>
  </div>
  <div id="ego-ring"></div>
</div>

<div id="hint">Drag an icon onto the road. Drag placed objects to move. Right-click / double-click to remove.</div>

<div id="toolbar">
  <button id="clear">Clear all</button>
  <div id="speed-box"><span>Speed of the simulation</span><button id="speed">1x</button></div>
  <button id="start" disabled>&#9654; Start<br>simulation</button>
</div>

<!-- Drive phase (hidden during setup) -->
<canvas id="view"></canvas>
<canvas id="minimap"></canvas>
<div id="countdown"></div>
<div id="look-center"></div>
<button id="abort">&#10005; Abort (Esc)</button>
<div id="done"><div class="box">
  <div class="title">Simulation complete</div>
  <div id="done-info"></div>
  <button id="back">Back to setup</button>
</div></div>

<script src="js/config.js"></script>
<script src="js/coords.js"></script>
<script src="js/gaze.js"></script>
<script src="js/ws.js"></script>
<script src="js/setup.js"></script>
<script src="js/render.js"></script>
<script src="js/sim.js"></script>
</body>
</html>
