# Everything incl. the webcam driver monitor and the voice client (both on the host) and the browser windows:
#   start.bat / ./start.sh   (they add compose.gpu.yml when an NVIDIA GPU is found)
# Docker part only:  docker compose up --build   (server, simulator, dashboard, ollama, ollama-pull, copilot)
#   with an NVIDIA GPU for Ollama:  docker compose -f compose.yml -f compose.gpu.yml up --build
# Video replay (needs driver_monitor/recordings/): docker compose --profile replay up --build
#   simulator       http://localhost:8080 (SIMULATOR_PORT)   browser page; its WebSocket goes to /ws
#   dashboard       http://localhost:8081 (DASHBOARD_PORT)   camera + chat + detections; WebSocket to /ws,
#                                                            camera image from the driver monitor (:8090)
#   server          ws://localhost:8765 (SERVER_PORT)        receives the simulator, the driver monitor, the dashboard
#                                                            and the copilot
#   ollama          (compose network only, ollama:11434)     runs the copilot's language models; they are kept in
#                                                            the "ollama" volume, so they download only once
#   ollama-pull     one-shot: downloads COPILOT_S1_MODEL / COPILOT_S2_MODEL into ollama if they are missing
#   copilot         ws://localhost:8766 (COPILOT_PORT)       AI copilot: takes the alerts from the server, answers
#                                                            the driver; voice_client.py on the host connects here
#   model-download  one-shot: downloads the MediaPipe model into driver_monitor/models/ if missing
#   driver-monitor  replays driver_monitor/recordings/$DM_VIDEO and streams driver_state to the server
# Ports, models and the video are set in .env.

name: aidrive

services:
  server:
    build: ./server_simulator_lookingdir
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      LOG_LEVEL: ${SERVER_LOG_LEVEL:-INFO}
      GAZE_HZ: ${GAZE_HZ:-30}
      DASHBOARD_HZ: ${DASHBOARD_HZ:-10}
      CAMERA_TIMEOUT_S: ${CAMERA_TIMEOUT_S:-1.0}
      FRONT_SPLIT_DEG: ${FRONT_SPLIT_DEG:-7}
      RECENT_ALERT_S: ${RECENT_ALERT_S:-5}
      EYES_CLOSED_VOICE_S: ${EYES_CLOSED_VOICE_S:-1.0}
      EYES_CLOSED_REPEAT_S: ${EYES_CLOSED_REPEAT_S:-3.0}
      ATTENTION_REPEAT_S: ${ATTENTION_REPEAT_S:-5.0}
    ports:
      - "${SERVER_PORT:-8765}:8765"

  simulator:
    build: ./simulator
    depends_on:
      - server
    ports:
      - "${SIMULATOR_PORT:-8080}:80"

  dashboard:
    build: ./dashboard
    depends_on:
      - server
    ports:
      - "${DASHBOARD_PORT:-8081}:80"

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.6}
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.6}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: ${COPILOT_S1_MODEL:-qwen3:1.7b} ${COPILOT_S2_MODEL:-qwen3:4b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    # Never fails: without the models (no internet) the copilot still speaks every safety alert.
    command:
      - |
        for m in $$MODELS; do
          if ollama show "$$m" >/dev/null 2>&1; then echo "$$m is already there"; continue; fi
          echo "downloading $$m (first start only, can take several minutes) ..."
          if out=$$(ollama pull "$$m" 2>&1); then echo "$$m downloaded"
          else echo "could not download $$m: $$(printf '%s' "$$out" | tail -n 1)"; fi
        done
    restart: "no"

  copilot:
    build: ./copilot
    depends_on:
      - server
      - ollama
    environment:
      HUB_URL: ws://server:8765
      OLLAMA_BASE: ${OLLAMA_BASE:-http://ollama:11434}
      COPILOT_S1_MODEL: ${COPILOT_S1_MODEL:-qwen3:1.7b}
      COPILOT_S2_MODEL: ${COPILOT_S2_MODEL:-qwen3:4b-instruct}
      DEGOOG_URL: ${DEGOOG_URL:-http://host.docker.internal:4444/api/search}
      LOG_LEVEL: ${COPILOT_LOG_LEVEL:-INFO}
    # COPILOT_ARGS=--no-llm in .env: safety alerts only, the language models are not used
    command: python -u ai-server.py ${COPILOT_ARGS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # a degoog search on the host (Linux needs this line)
    ports:
      - "${COPILOT_PORT:-8766}:8766"

  model-download:
    build: ./driver_monitor
    image: aidrive-driver-monitor
    profiles: ["replay"]
    command: ["python", "tools/download_model.py"]
    volumes:
      - ./driver_monitor/models:/app/models
    restart: "no"

  driver-monitor:
    build: ./driver_monitor
    image: aidrive-driver-monitor
    profiles: ["replay"]
    depends_on:
      model-download:
        condition: service_completed_successfully
      server:
        condition: service_started
    command:
      - python
      - -m
      - driver_monitor
      - --no-window
      - --scroll
      - --config
      - config/driver_monitor.docker.yaml
      - --video
      - recordings/${DM_VIDEO:-recording-10.mp4}
    ports:
      - "8090:8090"   # camera stream for the dashboard (the browser reads it at localhost:8090)
    volumes:
      - ./driver_monitor/models:/app/models:ro
      - ./driver_monitor/recordings:/app/recordings:ro

volumes:
  ollama:
