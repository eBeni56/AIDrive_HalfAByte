server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # index.html is not cached, so a rebuild is picked up on reload (the assets have hashed names).
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # WebSocket to the server container (service name "server" in compose.yml).
    location /ws {
        proxy_pass http://server:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
